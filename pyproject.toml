[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-splat-modal"
version = "0.1.0"
description = "Minimal Modal runner for COLMAP and Nerfstudio Splatfacto"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["modal>=1.5,<2"]

[tool.setuptools]
py-modules = ["control", "modal_app", "splat_job"]
